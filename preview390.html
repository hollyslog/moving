<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>390px 미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#2A2A28}
  .frame{width:390px;margin:0 auto;background:#FAF8F5}
  iframe{display:block;width:390px;height:980px;border:0}
</style>
</head>
<body>
<div class="frame"><iframe id="f" src="./index.html?preview=390" title="390px 미리보기"></iframe></div>
<script>
  document.getElementById("f").addEventListener("load", function(){
    try {
      var w = this.contentWindow, d = this.contentDocument;
      var el = d.getElementById("packBoard");
      if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.pageYOffset - 8);
    } catch(e){}
  });
</script>
</body>
</html>
