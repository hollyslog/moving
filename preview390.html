<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>390px 미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#2A2A28}
  .frame{width:390px;margin:0 auto;background:#FAF8F5;transform:scale(.8);transform-origin:top center}
  iframe{display:block;width:390px;height:1200px;border:0}
</style>
</head>
<body>
<div class="frame"><iframe id="f" src="./index.html?pv=6b4f627" title="390px 미리보기"></iframe></div>
<script>
  (function(){
    var f = document.getElementById("f");
    function jump(){
      try {
        var w = f.contentWindow, d = f.contentDocument;
        var el = d.getElementById("packBoard");
        if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.pageYOffset - 8);
      } catch(e){}
    }
    f.addEventListener("load", function(){ jump(); setTimeout(jump, 900); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ setTimeout(jump, 50); });
  })();
</script>
</body>
</html>
