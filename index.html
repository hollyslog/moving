<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 집 이사 타임라인 · 2026.12.17</title>
<meta name="description" content="힐스테이트 메디알레 59C 입주까지의 준비 일정을 한눈에 보는 타임라인.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF8F5">
<meta property="og:title" content="우리 집 이사 타임라인">
<meta property="og:description" content="힐스테이트 메디알레 59C · 2026.12.17(목)">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#FAF8F5;
    --card:#FFFFFF;
    --line:#EAE5DD;
    --line-strong:#DBD3C7;
    --ink:#22261F;
    --ink-soft:#4C5249;
    --muted:#8C877D;
    --sage:#5F7F66;
    --sage-soft:#ECF3EC;
    --sage-ink:#3D5843;
    --terra:#B4663F;
    --terra-soft:#F9EDE4;
    --terra-ink:#8C4726;
    --navy:#2E3E5C;
    --navy-soft:#ECF0F7;
    --amber:#9F7629;
    --amber-soft:#F8F1E0;
    --gray-soft:#F2EFE9;
    --radius:20px;
    --shadow:0 1px 2px rgba(34,38,31,.04), 0 10px 28px -20px rgba(34,38,31,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;
    line-height:1.55;
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(900px 420px at 12% -8%, rgba(95,127,102,.10), transparent 70%),
      radial-gradient(700px 380px at 96% 4%, rgba(180,102,63,.08), transparent 70%);
    pointer-events:none;z-index:0;
  }
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 20px 64px}

  /* ---------- 상단 바 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 2px 18px;
    font-size:11.5px;letter-spacing:.14em;color:var(--muted);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .brand .mark{
    width:7px;height:7px;border-radius:50%;
    background:var(--sage);box-shadow:0 0 0 4px rgba(95,127,102,.14);
  }
  .today{font-variant-numeric:tabular-nums;letter-spacing:.06em}

  /* ---------- 헤더 ---------- */
  header.hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:26px;
    padding:24px 24px 20px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:"";position:absolute;right:-60px;top:-70px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(95,127,102,.16), rgba(95,127,102,0) 68%);
    pointer-events:none;
  }
  .eyebrow{
    margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.18em;
    color:var(--sage);text-transform:uppercase;
  }
  .hero-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  h1{
    margin:0;font-size:clamp(23px,6.4vw,30px);line-height:1.3;
    font-weight:800;letter-spacing:-0.035em;
  }
  .sub{
    margin:8px 0 0;color:var(--ink-soft);font-size:14px;font-weight:500;
    letter-spacing:-0.005em;
  }
  .sub .dotsep{color:var(--line-strong);margin:0 6px}
  .dday{
    flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    min-width:82px;padding:11px 12px;border-radius:16px;
    background:var(--sage);color:#fff;
    font-weight:800;font-size:18px;letter-spacing:-0.02em;line-height:1.1;
    box-shadow:0 8px 20px -12px rgba(61,88,67,.9);
  }
  .dday .dd{display:block;white-space:nowrap}
  .dday small{display:block;margin-top:5px;font-size:9.5px;font-weight:600;letter-spacing:.12em;opacity:.82}
  .dday.soon{background:var(--terra);box-shadow:0 8px 20px -12px rgba(140,71,38,.9)}
  .dday.today{background:var(--navy);box-shadow:0 8px 20px -12px rgba(46,62,92,.9)}
  .nextup{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:18px;padding-top:15px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--ink-soft);
  }
  .nextup .lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--muted)}
  .nextup b{font-weight:650;color:var(--ink)}
  .nextup .tick{
    margin-left:auto;flex:none;font-size:11.5px;font-weight:700;color:var(--terra);
    background:var(--terra-soft);padding:3px 9px;border-radius:999px;
  }
  .peek{
    display:flex;align-items:center;gap:8px;width:100%;margin-top:13px;
    padding:10px 13px;border-radius:14px;cursor:pointer;text-align:left;
    border:1px solid #E7DCC8;background:linear-gradient(180deg,#FDF8EE,#FBF1DE);
    font-family:inherit;font-size:12.5px;font-weight:600;color:#7A5A22;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .peek:hover{box-shadow:0 8px 18px -14px rgba(122,90,34,.7)}
  .peek:active{transform:scale(.99)}
  .peek .pk-ico{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;border-radius:6px;background:#EBD9B8;color:#6E4E14;
    font-size:10.5px;font-weight:900;line-height:1;
  }
  .peek b{font-weight:800;color:#5E4310}
  .peek .pk-a{
    flex:none;margin-left:auto;padding:3px 9px;border-radius:999px;background:#fff;
    font-size:10.5px;font-weight:800;color:#7A5A22;box-shadow:inset 0 0 0 1px #E7DCC8;
  }

  /* ---------- 요약 스탯 ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    margin:14px 0 0;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .stat{padding:16px 10px 15px;text-align:center;position:relative}
  .stat + .stat::before{
    content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line);
  }
  .stat .n{display:block;font-size:23px;font-weight:800;letter-spacing:-0.04em;line-height:1.2}
  .stat .k{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:-0.01em}
  .stat.c1 .n{color:var(--ink)}
  .stat.c2 .n{color:var(--sage)}
  .stat.c3 .n{color:var(--terra)}

  /* ---------- 필터 탭 ---------- */
  .tabs{
    display:flex;gap:8px;margin:22px -20px 0;padding:2px 20px 4px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;appearance:none;cursor:pointer;
    border:1px solid var(--line-strong);background:rgba(255,255,255,.7);
    color:var(--ink-soft);
    padding:9px 15px;border-radius:999px;
    font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-0.01em;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
  }
  .tab:hover{border-color:var(--ink-soft)}
  .tab:active{transform:scale(.97)}
  .tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

  /* ---------- 미니 달력 ---------- */
  .calendars{
    margin-top:18px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 16px 14px;
  }
  .cal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cal{padding:2px}
  .cal-head{
    display:flex;align-items:baseline;justify-content:flex-start;gap:7px;
    margin-bottom:10px;padding:0 3px;
  }
  .cal-head .m{font-size:14px;font-weight:750;letter-spacing:-0.02em}
  .cal-head .y{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
  .dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dow span{
    text-align:center;font-size:10.5px;font-weight:600;color:var(--muted);
    padding-bottom:5px;letter-spacing:0;
  }
  .dow span:first-child{color:var(--terra)}
  .dow span:last-child{color:var(--navy)}
  .day{
    position:relative;aspect-ratio:1/1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:0;background:none;font-family:inherit;
    font-size:12px;font-weight:550;color:var(--ink-soft);
    border-radius:10px;cursor:default;padding:0;
  }
  .day.pad{visibility:hidden;aspect-ratio:1/1}
  .day.has{cursor:pointer;font-weight:700;color:var(--ink);background:var(--gray-soft)}
  .day.has:hover{background:#E9E4DB}
  .day.today{box-shadow:inset 0 0 0 1.5px var(--sage);color:var(--sage-ink);font-weight:800}
  .day.sel{background:var(--navy);color:#fff}
  .day.sel .dots i{background:rgba(255,255,255,.85)!important}
  .day .dots{
    position:absolute;bottom:5px;left:0;right:0;
    display:flex;justify-content:center;gap:2.5px;
  }
  .day .dots i{width:4px;height:4px;border-radius:50%;display:block}
  .legend{
    display:flex;flex-wrap:wrap;gap:11px;align-items:center;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);
  }
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:6px;height:6px;border-radius:50%;display:block}

  /* ---------- 타임라인 ---------- */
  .tl-head{display:flex;align-items:center;gap:10px;margin:30px 2px 12px}
  .tl-head h2{
    margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;
    color:var(--muted);text-transform:uppercase;
  }
  .tl-head .clear{
    margin-left:auto;appearance:none;cursor:pointer;font-family:inherit;
    background:var(--navy-soft);color:var(--navy);border:0;
    padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:700;
  }
  .tl-head .clear[hidden]{display:none}

  .timeline{position:relative;padding-left:22px}
  .timeline::before{
    content:"";position:absolute;left:4.5px;top:10px;bottom:12px;width:1.5px;
    background:linear-gradient(to bottom,var(--line-strong),var(--line) 60%,transparent);
  }
  .item{position:relative;margin-bottom:12px;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .item::before{
    content:"";position:absolute;left:-22px;top:26px;
    width:10px;height:10px;border-radius:50%;
    background:var(--card);border:2px solid var(--line-strong);
    box-sizing:content-box;
  }
  .item[data-cat="loan"]::before{border-color:var(--navy)}
  .item[data-cat="build"]::before{border-color:var(--sage)}
  .item[data-cat="furniture"]::before{border-color:var(--terra)}
  .item[data-cat="check"]::before{border-color:var(--amber)}
  .item[data-cat="move"]::before{border-color:var(--sage-ink);background:var(--sage-ink)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 17px 15px;box-shadow:0 1px 2px rgba(34,38,31,.035);
    transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;
  }
  .card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);transform:translateY(-1px)}
  .item.hero-item .card{
    border-color:#D8E2D8;
    background:linear-gradient(180deg,#FBFDFA 0%,#FFFFFF 70%);
    box-shadow:var(--shadow);
  }
  .item.undated .card{border-style:dashed;background:rgba(255,255,255,.66)}
  .item.hero-item .card h3{font-size:18px}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:7px}
  .when{
    font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);
    display:flex;align-items:center;gap:7px;
  }
  .when .cal-ico{color:var(--muted);font-size:11px}
  .card h3{
    margin:9px 0 0;font-size:16.5px;font-weight:750;letter-spacing:-0.025em;line-height:1.42;
  }
  .kv{display:flex;gap:10px;margin-top:9px;align-items:flex-start}
  .kv .k{
    flex:none;width:58px;padding-top:3px;
    font-size:10px;font-weight:750;letter-spacing:.04em;color:var(--muted);
  }
  .kv .v{font-size:13.2px;line-height:1.55;font-weight:650;color:var(--ink)}
  .kv .v .none{font-weight:500;color:var(--muted)}
  .kv.note .v{font-weight:450;color:var(--ink-soft);letter-spacing:-0.005em}
  .card-foot{display:flex;align-items:center;gap:7px;margin-top:13px;flex-wrap:wrap}

  /* ---------- 카드 내부 구조 (업체 · 방문/진행 · 비용/결제 · 확인사항) ---------- */
  .vendor{display:flex;gap:7px;align-items:baseline;margin-top:8px;font-size:12.8px;letter-spacing:-0.005em}
  .vendor .k{flex:none;width:26px;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--muted)}
  .vendor .v{flex:1;min-width:0;font-weight:650;color:var(--ink-soft)}
  .vendor .v .none{font-weight:500;color:var(--muted)}

  .flow{display:flex;flex-direction:column;gap:8px;margin-top:11px}

  /* 방문·진행 */
  .visit{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:4px;
    padding:8px 11px;border-radius:12px;background:#F6F4EF;
    box-shadow:inset 0 0 0 1px rgba(219,211,199,.6);
  }
  .visit .vi{flex:none;font-size:12px;line-height:1;color:var(--navy);opacity:.7}
  .visit .vk{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--muted)}
  .visit .vt{flex:1 1 130px;min-width:0;font-size:12.4px;line-height:1.45;font-weight:600;color:var(--ink-soft)}
  .visit .vp{
    flex:none;margin-left:auto;white-space:nowrap;
    padding:2.5px 8px;border-radius:999px;background:#fff;
    font-size:10px;font-weight:800;letter-spacing:0;color:var(--ink-soft);
    box-shadow:inset 0 0 0 1px var(--line-strong);
  }
  .visit .vp.ok{background:var(--sage-soft);color:var(--sage-ink);box-shadow:inset 0 0 0 1px #CFE0D2}
  .visit .vp.pend{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px #EBD9B8}

  /* 비용·결제 */
  .cost{border:1px solid var(--line);border-radius:12px;background:#FDFCF9;overflow:hidden}
  .sect-h{
    display:flex;align-items:center;gap:6px;
    padding:7px 11px 6px;background:#F8F5EF;border-bottom:1px solid var(--line);
    font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  }
  .sect-h .sh-ico{font-size:10px;opacity:.75}
  .sect-h .pay{
    margin-left:auto;padding:2px 7px;border-radius:999px;background:#fff;
    font-size:10px;font-weight:800;letter-spacing:0;color:var(--sage-ink);
    box-shadow:inset 0 0 0 1px #CFE0D2;white-space:nowrap;
  }
  .crow{display:flex;align-items:baseline;gap:10px;padding:6.5px 11px;font-size:12.4px}
  .crow + .crow{border-top:1px solid #F3EFE7}
  .crow .ck{flex:none;width:46px;font-size:10.5px;font-weight:750;letter-spacing:.01em;color:var(--muted)}
  .crow .cv{flex:1;min-width:0;font-weight:650;letter-spacing:-0.01em;color:var(--ink-soft)}
  .crow.total .cv{font-weight:800;color:var(--terra-ink)}

  /* 확인·요청 사항 (callout) */
  .callout{
    border:1px solid #EBD9B8;border-radius:13px;
    background:linear-gradient(180deg,#FDF7EA,#FBF2DF);
    padding:9px 12px 10px;
  }
  .co-h{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#8A641F}
  .co-h .co-ico{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:13px;height:13px;border-radius:4px;background:#EBD9B8;color:#6E4E14;
    font-size:9px;font-weight:900;line-height:1;
  }
  .co-h .co-n{margin-left:auto;padding:1px 6px;border-radius:999px;background:rgba(139,100,31,.10);font-size:10px;font-weight:800}
  .callout ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
  .callout li{display:flex;gap:7px;align-items:flex-start;font-size:12.4px;line-height:1.5;font-weight:550;color:#6E5220}
  .callout li .cb{
    flex:none;width:11px;height:11px;margin-top:3.5px;border-radius:3px;
    background:#fff;border:1.5px solid #D6BE8C;
  }

  .memo{margin:9px 0 0;font-size:12.1px;line-height:1.55;font-weight:450;letter-spacing:-0.005em;color:var(--muted)}

  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 9px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;
  }
  .badge.status::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .st-confirm{background:var(--sage-soft);color:var(--sage-ink)}
  .st-done{background:#3D5843;color:#fff}
  .st-done::before{background:#C9DCCB!important}
  .st-paid{background:#E1EDE3;color:#2E5236;box-shadow:inset 0 0 0 1px rgba(46,82,54,.13)}
  .st-bought{background:var(--navy-soft);color:var(--navy)}
  .st-bought-pend{background:var(--amber-soft);color:var(--navy);box-shadow:inset 0 0 0 1px rgba(46,62,92,.20)}
  .st-done-coord{background:#F5EBD6;color:#8A641F;box-shadow:inset 0 0 0 1px rgba(138,100,31,.12)}
  .st-check{background:var(--amber-soft);color:var(--amber)}
  .st-urgent{background:var(--terra-soft);color:var(--terra-ink)}
  .st-coord{background:var(--amber-soft);color:var(--amber)}
  .st-wait{background:var(--gray-soft);color:#77726A}
  .badge.cat{background:#FBF9F5;color:var(--ink-soft);border:1px solid var(--line);font-weight:600}
  .badge.money{background:#FBF6EE;border:1px solid var(--line);color:#7F6136;font-weight:700}

  /* ---------- 비용 요약 ---------- */
  .money{
    margin-top:16px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  .money-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding:17px 18px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .money-head h3{margin:0;font-size:14.5px;font-weight:750;letter-spacing:-0.02em}
  .money-sub{
    margin:5px 0 0;font-size:11.5px;line-height:1.5;font-weight:500;
    color:var(--muted);letter-spacing:-0.005em;max-width:44ch;
  }
  .money-total{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto;text-align:right}
  .money-total .mt-k{font-size:10px;font-weight:750;letter-spacing:.05em;color:var(--muted)}
  .money-total .mt-v{font-size:20px;font-weight:800;letter-spacing:-0.04em;color:var(--terra-ink);line-height:1.2}
  .money-total .mt-v small{font-size:11.5px;font-weight:700;margin-left:1px}

  .mhead{
    display:grid;grid-template-columns:minmax(0,1.55fr) .78fr .82fr 1.05fr .95fr;gap:10px;
    padding:8px 18px 7px;background:#FAF7F2;border-bottom:1px solid var(--line);
    font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--muted);
  }
  .mtable{padding:0}
  .mrow{
    display:grid;grid-template-columns:minmax(0,1.55fr) .78fr .82fr 1.05fr .95fr;gap:10px;
    align-items:center;padding:9.5px 18px;font-size:12.6px;
  }
  .mrow + .mrow{border-top:1px solid #F5F2EC}
  .mname{min-width:0;font-weight:700;color:var(--ink);letter-spacing:-0.015em;line-height:1.4}

  function renderCals(){ calsEl.innerHTML = buildMonth(2026, 10) + buildMonth(2026, 11); }
  calsEl.addEventListener("click", function(ev){
    var b = ev.target.closest(".day.has");
    if (!b) return;
    var ds = b.getAttribute("data-date");
    var same = state.date === ds;
    state.date = same ? null : ds;
    state.cat = "all";
    syncTabs(); renderCals(); renderTodo(); render();
    if (state.date) {
      var el = document.querySelector('.item[data-date="' + state.date + '"]');
      if (el) window.scrollTo({ top: window.pageYOffset + el.getBoundingClientRect().top - 18, behavior:"smooth" });
    }
  });

  /* ---------------- 타임라인 ---------------- */
  var tlEl = document.getElementById("timeline");
  var emptyEl = document.getElementById("empty");
  var clearBtn = document.getElementById("clearFilter");
  var todoHost = document.createElement("div");
  todoHost.id = "todoHost";
  tlEl.parentNode.insertBefore(todoHost, emptyEl);

  function fmtDate(s){
    var d = parse(s);
    return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")";
  }
  function timeOrder(e){
    if (!e.time) return 0;
    if (e.time === "오전") return 1;
    if (e.time === "오후") return 2;
    var m = /^(\d{1,2}):(\d{2})$/.exec(e.time);
    if (m) return 10 + (+m[1]) + (+m[2]) / 60;
    return 3;
  }

  function matches(e){
    if (state.date && e.date !== state.date) return false;
    if (state.cat === "all") return true;
    if (state.cat === "check") return e.cat === "move";
    return e.cat === state.cat;
  }

  function visitHTML(e){
    if (!e.visit) return "";
    var ok = (e.visit.state === "확정" || e.visit.state === "예약 완료");
    return '<div class="visit">' +
      '<span class="vi" aria-hidden="true">◷</span>' +
      '<span class="vk">방문·진행</span>' +
      '<span class="vt">' + e.visit.text + '</span>' +
      '<span class="vp ' + (ok ? "ok" : "pend") + '">' + e.visit.state + '</span>' +
    '</div>';
  }

  function costHTML(e){
    if (!e.cost || !e.cost.length) return "";
    var rows = e.cost.map(function(c){
      return '<div class="crow' + (c.total ? " total" : "") + '">' +
        '<span class="ck">' + c.k + '</span>' +
        '<span class="cv">' + c.v + '</span>' +
      '</div>';
    }).join("");
    return '<div class="cost">' +
      '<div class="sect-h"><span class="sh-ico" aria-hidden="true">₩</span>비용·결제' +
        (e.pay ? '<span class="pay">' + e.pay + '</span>' : '') +
      '</div>' +
      '<div class="crows">' + rows + '</div>' +
    '</div>';
  }

  function checksHTML(e){
    if (!e.checks || !e.checks.length) return "";
    return '<div class="callout">' +
      '<div class="co-h"><span class="co-ico" aria-hidden="true">✓</span>확인·요청 사항' +
        '<span class="co-n">' + e.checks.length + '</span>' +
      '</div>' +
      '<ul>' + e.checks.map(function(t){
        return '<li><span class="cb" aria-hidden="true"></span><span>' + t + '</span></li>';
      }).join("") + '</ul>' +
    '</div>';
  }

  function cardHTML(e, idx){
    var cat = CAT_MAP[e.cat] || {label:"기타"};
    var st = STATUS[e.status] || STATUS["대기"];
    var past = e.date && daysBetween(parse(e.date), TODAY) > 0 && !st.settled;
    var when = e.date
      ? '<span class="when"><span class="cal-ico">◷</span>' + fmtDate(e.date) + (e.dateHint ? ' · ' + e.dateHint : '') + (e.time ? ' · ' + e.time : '') + '</span>'
      : '<span class="when">' + (e.datelabel || '일정 미정') + '</span>';
    var vendor = '<div class="vendor"><span class="k">업체</span><span class="v">' +
      (e.vendor || '<span class="none">미정</span>') + '</span></div>';
    return '<article class="item' + (e.hero ? " hero-item" : "") + (e.date ? "" : " undated") + (past ? " past" : "") +
      '" data-cat="' + e.cat + '"' + (e.date ? ' data-date="' + e.date + '"' : "") +
      ' style="animation-delay:' + Math.min(idx * 45, 320) + 'ms">' +
      '<div class="card">' +
        '<div class="card-top">' + when +
          '<span class="badge status ' + st.cls + '">' + e.status + '</span>' +
        '</div>' +
        '<h3>' + e.title + '</h3>' +
        vendor +
        '<div class="flow">' + visitHTML(e) + costHTML(e) + checksHTML(e) + '</div>' +
        (e.memo ? '<p class="memo">' + e.memo + '</p>' : '') +
        '<div class="card-foot"><span class="badge cat">' + cat.label + '</span></div>' +
      '</div></article>';
  }

  function render(){
    var list = EVENTS.filter(matches).slice().sort(function(a, b){
      if (a.date && b.date) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (timeOrder(a) - timeOrder(b)) || ((STATUS[a.status]||{}).order - (STATUS[b.status]||{}).order);
      }
      if (a.date) return -1;
      if (b.date) return 1;
      return (STATUS[a.status]||{}).order - (STATUS[b.status]||{}).order;
    });
    tlEl.innerHTML = list.map(cardHTML).join("");
    emptyEl.hidden = list.length > 0;

    var filtered = state.cat !== "all" || state.date;
    if (state.date) {
      clearBtn.hidden = false;
      clearBtn.textContent = fmtDate(state.date) + " · 필터 해제 ×";
    } else if (state.cat !== "all") {
      clearBtn.hidden = false;
      clearBtn.textContent = (state.cat === "check" ? "체크리스트" : (CAT_MAP[state.cat]||{}).label) + " · 필터 해제 ×";
    } else {
      clearBtn.hidden = true;
    }
  }

  /* ---------------- 체크리스트 ---------------- */
  function renderTodo(){
    var show = !state.date && (state.cat === "all" || state.cat === "check");
    if (!show) { todoHost.innerHTML = ""; return; }
    var rooms = [], groups = {};
    CHECKS.forEach(function(c){
      if (!groups[c.room]) { groups[c.room] = []; rooms.push(c.room); }
      groups[c.room].push(c);
    });
    var body = rooms.map(function(r){
      return '<div class="todo-group"><span class="room">' + r + '</span>' +
        groups[r].map(function(c){
          var meta = (c.status || c.memo)
            ? '<span class="nt">' +
                (c.status ? '<span class="todo-st' + (c.done ? ' done' : '') + '">' + c.status + '</span>' : '') +
                (c.memo ? '<span class="nm">' + c.memo + '</span>' : '') +
              '</span>'
            : '';
          return '<div class="todo-row"><span class="box' + (c.done ? ' done' : '') + '" aria-hidden="true"></span>' +
            '<span class="tx">' + c.text + meta + '</span></div>';
        }).join("") + '</div>';
    }).join("");
    todoHost.innerHTML =
      '<section class="todo" aria-label="할 일 체크리스트">' +
        '<div class="todo-head"><h3>할 일 체크리스트</h3><span class="cnt">' + CHECKS.length + '개</span></div>' +
        body +
      '</section>';
  }

  clearBtn.addEventListener("click", function(){
    state.cat = "all"; state.date = null;
    syncTabs(); renderCals(); renderTodo(); render();
  });

  renderCals();
  renderTodo();
  render();
})();
</script>
</body>
</html>
