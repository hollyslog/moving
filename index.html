<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 집 이사 타임라인 · 2026.12.17</title>
<meta name="description" content="힐스테이트 메디알레 59C 입주까지의 준비 일정을 한눈에 보는 타임라인.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF8F5">
<meta property="og:title" content="우리 집 이사 타임라인">
<meta property="og:description" content="힐스테이트 메디알레 59C · 2026.12.17(목)">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#FAF8F5;
    --card:#FFFFFF;
    --line:#EAE5DD;
    --line-strong:#DBD3C7;
    --ink:#22261F;
    --ink-soft:#4C5249;
    --muted:#8C877D;
    --sage:#5F7F66;
    --sage-soft:#ECF3EC;
    --sage-ink:#3D5843;
    --terra:#B4663F;
    --terra-soft:#F9EDE4;
    --terra-ink:#8C4726;
    --navy:#2E3E5C;
    --navy-soft:#ECF0F7;
    --amber:#9F7629;
    --amber-soft:#F8F1E0;
    --gray-soft:#F2EFE9;
    --radius:20px;
    --shadow:0 1px 2px rgba(34,38,31,.04), 0 10px 28px -20px rgba(34,38,31,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;
    line-height:1.55;
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  /* 무늬 없는 은은한 배경 결 */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(900px 420px at 12% -8%, rgba(95,127,102,.10), transparent 70%),
      radial-gradient(700px 380px at 96% 4%, rgba(180,102,63,.08), transparent 70%);
    pointer-events:none;z-index:0;
  }
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 20px 64px}

  /* ---------- 상단 바 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 2px 18px;
    font-size:11.5px;letter-spacing:.14em;color:var(--muted);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .brand .mark{
    width:7px;height:7px;border-radius:50%;
    background:var(--sage);box-shadow:0 0 0 4px rgba(95,127,102,.14);
  }
  .today{font-variant-numeric:tabular-nums;letter-spacing:.06em}

  /* ---------- 헤더 ---------- */
  header.hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:26px;
    padding:26px 24px 22px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:"";position:absolute;right:-60px;top:-70px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(95,127,102,.16), rgba(95,127,102,0) 68%);
    pointer-events:none;
  }
  .eyebrow{
    margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.18em;
    color:var(--sage);text-transform:uppercase;
  }
  .hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  h1{
    margin:0;font-size:clamp(23px,6.4vw,30px);line-height:1.3;
    font-weight:800;letter-spacing:-0.035em;
  }
  .sub{
    margin:9px 0 0;color:var(--ink-soft);font-size:14px;font-weight:500;
    letter-spacing:-0.005em;
  }
  .sub .dotsep{color:var(--line-strong);margin:0 6px}
  .dday{
    flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:82px;padding:11px 12px;border-radius:16px;
    background:var(--sage);color:#fff;
    font-weight:800;font-size:18px;letter-spacing:-0.02em;line-height:1.1;
    box-shadow:0 8px 20px -12px rgba(61,88,67,.9);
  }
  .dday small{display:block;margin-top:5px;font-size:9.5px;font-weight:600;letter-spacing:.12em;opacity:.82}
  .dday.soon{background:var(--terra);box-shadow:0 8px 20px -12px rgba(140,71,38,.9)}
  .dday.today{background:var(--navy);box-shadow:0 8px 20px -12px rgba(46,62,92,.9)}
  .nextup{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--ink-soft);
  }
  .nextup .lbl{
    font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--muted);
  }
  .nextup b{font-weight:650;color:var(--ink)}
  .nextup .tick{
    margin-left:auto;flex:none;font-size:11.5px;font-weight:700;color:var(--terra);
    background:var(--terra-soft);padding:3px 9px;border-radius:999px;
  }

  /* ---------- 요약 스탯 ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    margin:14px 0 0;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .stat{padding:16px 12px 15px;text-align:center;position:relative}
  .stat + .stat::before{
    content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line);
  }
  .stat .n{display:block;font-size:23px;font-weight:800;letter-spacing:-0.04em;line-height:1.2}
  .stat .k{display:block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:0}
  .stat.c1 .n{color:var(--ink)}
  .stat.c2 .n{color:var(--sage)}
  .stat.c3 .n{color:var(--terra)}

  /* ---------- 필터 탭 ---------- */
  .tabs{
    display:flex;gap:8px;margin:22px -20px 0;padding:2px 20px 4px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;appearance:none;cursor:pointer;
    border:1px solid var(--line-strong);background:rgba(255,255,255,.7);
    color:var(--ink-soft);
    padding:9px 15px;border-radius:999px;
    font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-0.01em;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
  }
  .tab:hover{border-color:var(--ink-soft)}
  .tab:active{transform:scale(.97)}
  .tab[aria-pressed="true"]{
    background:var(--navy);border-color:var(--navy);color:#fff;
  }

  /* ---------- 미니 달력 ---------- */
  .calendars{
    margin-top:18px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 16px 14px;
  }
  .cal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cal{padding:2px}
  .cal-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:10px;padding:0 2px;
  }
  .cal-head .m{font-size:14px;font-weight:750;letter-spacing:-0.02em}
  .cal-head .y{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em}
  .dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .dow span{
    text-align:center;font-size:10.5px;font-weight:600;color:var(--muted);
    padding-bottom:5px;letter-spacing:0;
  }
  .dow span:first-child{color:var(--terra)}
  .dow span:last-child{color:var(--navy)}
  .day{
    position:relative;aspect-ratio:1/1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:0;background:none;font-family:inherit;
    font-size:12px;font-weight:550;color:var(--ink-soft);
    border-radius:10px;cursor:default;
  }
  .day.pad{visibility:hidden}
  .day.has{cursor:pointer;font-weight:700;color:var(--ink);background:var(--gray-soft)}
  .day.has:hover{background:#E9E4DB}
  .day.today{box-shadow:inset 0 0 0 1.5px var(--sage);color:var(--sage-ink);font-weight:800}
  .day.sel{background:var(--navy);color:#fff}
  .day.sel .dots i{background:rgba(255,255,255,.85)!important}
  .day .dots{
    position:absolute;bottom:5px;left:0;right:0;
    display:flex;justify-content:center;gap:2.5px;
  }
  .day .dots i{width:4px;height:4px;border-radius:50%;display:block}
  .legend{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);
  }
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:6px;height:6px;border-radius:50%;display:block}

  /* ---------- 타임라인 ---------- */
  .tl-head{
    display:flex;align-items:center;gap:10px;
    margin:30px 2px 12px;
  }
  .tl-head h2{
    margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;
    color:var(--muted);text-transform:uppercase;
  }
  .tl-head .clear{
    margin-left:auto;appearance:none;cursor:pointer;font-family:inherit;
    background:var(--navy-soft);color:var(--navy);border:0;
    padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:700;
  }
  .tl-head .clear[hidden]{display:none}

  .timeline{position:relative;padding-left:22px}
  .timeline::before{
    content:"";position:absolute;left:4.5px;top:10px;bottom:12px;width:1.5px;
    background:linear-gradient(to bottom,var(--line-strong),var(--line) 60%,transparent);
  }
  .item{position:relative;margin-bottom:12px;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .item::before{
    content:"";position:absolute;left:-22px;top:26px;
    width:10px;height:10px;border-radius:50%;
    background:var(--card);border:2px solid var(--line-strong);
    box-sizing:content-box;
  }
  .item[data-cat="loan"]::before{border-color:var(--navy)}
  .item[data-cat="build"]::before{border-color:var(--sage)}
  .item[data-cat="furniture"]::before{border-color:var(--terra)}
  .item[data-cat="check"]::before{border-color:var(--amber)}
  .item.hero-item::before{border-color:var(--sage);background:var(--sage)}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 17px 15px;box-shadow:0 1px 2px rgba(34,38,31,.035);
    transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;
  }
  .card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);transform:translateY(-1px)}
  .item.undated .card{border-style:dashed;background:rgba(255,255,255,.62)}
  .item.past .card{opacity:.62}
  .item.hero-item .card{
    border-color:#D8E2D8;
    background:linear-gradient(180deg,#FBFDFA 0%,#FFFFFF 70%);
    box-shadow:var(--shadow);
  }

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .when{
    font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);
    display:flex;align-items:center;gap:7px;
  }
  .when .cal-ico{color:var(--muted);font-size:11px}
  .when.undated{color:var(--muted);font-weight:600;font-style:normal}
  .card h3{
    margin:9px 0 0;font-size:16.5px;font-weight:750;letter-spacing:-0.025em;line-height:1.42;
  }
  .memo{
    margin:7px 0 0;font-size:13.5px;line-height:1.62;color:var(--ink-soft);
    letter-spacing:-0.005em;
  }
  .card-foot{display:flex;align-items:center;gap:7px;margin-top:13px;flex-wrap:wrap}

  .badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 9px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:0;white-space:nowrap;
  }
  .badge.status::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .st-confirm{background:var(--sage-soft);color:var(--sage-ink)}
  .st-urgent{background:var(--terra-soft);color:var(--terra-ink)}
  .st-coord{background:var(--amber-soft);color:var(--amber)}
  .st-wait{background:var(--gray-soft);color:#77726A}
  .badge.cat{background:#FBF9F5;color:var(--ink-soft);border:1px solid var(--line);font-weight:600}

  .empty{
    margin-top:16px;padding:34px 20px;text-align:center;
    border:1px dashed var(--line-strong);border-radius:var(--radius);
    color:var(--muted);font-size:13.5px;background:rgba(255,255,255,.5);
  }
  .empty[hidden]{display:none}

  footer{
    margin-top:34px;padding-top:20px;border-top:1px solid var(--line);
    text-align:center;font-size:12px;color:var(--muted);line-height:1.8;
  }
  footer b{color:var(--ink-soft);font-weight:650}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ---------- 좁은 화면 ---------- */
  @media (max-width:560px){
    .wrap{padding:0 16px 52px}
    header.hero{padding:22px 18px 18px;border-radius:22px}
    .sub{font-size:13px}
    .dday{min-width:72px;font-size:16px;border-radius:14px;padding:10px}
    .stats{margin-top:12px}
    .stat{padding:14px 8px 13px}
    .stat .n{font-size:21px}
    .stat .k{font-size:11px}
    .tabs{margin:20px -16px 0;padding:2px 16px 4px}
    .cal-grid{gap:6px}
    .cal-head .y{display:none}
    .day{font-size:11.5px;border-radius:9px}
    .legend{gap:10px}
    .timeline{padding-left:20px}
    .item::before{left:-20px;top:24px}
    .card{padding:15px 15px 14px;border-radius:16px}
    .card h3{font-size:15.5px}
    .memo{font-size:13px}
  }
  @media (max-width:360px){
    .cal-grid{grid-template-columns:1fr}
    .cal + .cal{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="brand"><span class="mark"></span>MOVING PLAN</span>
    <span class="today" id="todayLabel"></span>
  </div>

  <header class="hero">
    <div class="hero-row">
      <div>
        <p class="eyebrow">2026 · Winter</p>
        <h1>우리 집 이사 타임라인</h1>
        <p class="sub">힐스테이트 메디알레 59C<span class="dotsep">·</span>2026.12.17(목)</p>
      </div>
      <div class="dday" id="dday" aria-live="polite">D-<span id="ddayNum">22</span></div>
    </div>
    <div class="nextup" id="nextup"></div>
  </header>

  <section class="stats" aria-label="일정 요약">
    <div class="stat c1"><span class="n" id="statAll">0</span><span class="k">전체 일정</span></div>
    <div class="stat c2"><span class="n" id="statDone">0</span><span class="k">확정</span></div>
    <div class="stat c3"><span class="n" id="statPend">0</span><span class="k">조율 · 대기</span></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="카테고리 필터"></nav>

  <section class="calendars" aria-label="11월 · 12월 달력">
    <div class="cal-grid" id="cals"></div>
    <div class="legend">
      <span><i style="background:#2E3E5C"></i>대출·서류</span>
      <span><i style="background:#5F7F66"></i>시공</span>
      <span><i style="background:#B4663F"></i>가구·배송</span>
      <span><i style="background:#9F7629"></i>체크리스트</span>
    </div>
  </section>

  <div class="tl-head">
    <h2>Timeline</h2>
    <button class="clear" id="clearFilter" hidden>필터 해제 ×</button>
  </div>

  <div class="timeline" id="timeline"></div>
  <div class="empty" id="empty" hidden>이 조건에 맞는 일정이 아직 없어요.</div>

  <footer>
    Managed by <b>홀리</b> · 일정 추가/변경은 홀리에게 말씀해 주세요
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- 일정 데이터 (민감정보 없이) ---------------- */
  var MOVE_DAY = "2026-12-17";

  var CATS = [
    {id:"loan",      label:"🏦 대출·서류", color:"#2E3E5C"},
    {id:"build",     label:"🛠️ 시공",     color:"#5F7F66"},
    {id:"furniture", label:"📦 가구·배송", color:"#B4663F"},
    {id:"check",     label:"✅ 체크리스트", color:"#9F7629"}
  ];
  var CAT_MAP = {};
  CATS.forEach(function(c){ CAT_MAP[c.id] = c; });

  var STATUS = {
    "확정":     {cls:"st-confirm", order:0},
    "마감임박": {cls:"st-urgent",  order:1},
    "조율중":   {cls:"st-coord",   order:2},
    "대기":     {cls:"st-wait",    order:3}
  };

  var EVENTS = [
    {id:1, date:"2026-11-30", cat:"furniture", status:"마감임박",
     title:"나산가구 블프 세일 마감",
     memo:"전 품목 할인 종료 — 12월 이사일 배송 지정이 가능한지 확인이 필요해요."},

    {id:2, date:"2026-11-30", cat:"furniture", status:"조율중",
     title:"에싸 브루클린 컴팩트 4인 혜택 마감",
     memo:"크라비츠 크림화이트 / 제작 5~6주 소요 — 12/17 배송 가능 여부와 주소 확인 필요."},

    {id:3, date:"2026-12-17", cat:"check", status:"확정", hero:true,
     title:"이사 당일 🎉",
     memo:"은평구 힐스테이트 메디알레 59C 입주."},

    {id:4, date:null, cat:"build", status:"대기",
     title:"거실 아기 매트 시공",
     memo:"소파·가구 배치 전후로 일정 조율이 필요해요."},

    {id:5, date:null, cat:"furniture", status:"대기",
     title:"솔이방 옷장·서랍장",
     memo:"이케아 PAX(150cm 여닫이) vs 나산가구 주니어옷장·5단 서랍장 — 결정 후 배송 예약."},

    {id:6, date:null, cat:"loan", status:"대기",
     title:"대출 실행일 / 입주 청소 / 가전·인터넷",
     memo:"확정되는 대로 이 타임라인에 추가될 예정이에요."}
  ];

  /* ---------------- 날짜 유틸 ---------------- */
  var DOW = ["일","월","화","수","목","금","토"];
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parse(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function todayMidnight(){
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function daysBetween(a, b){
    return Math.round((b - a) / 86400000);
  }

  var TODAY = todayMidnight();
  var TODAY_STR = ymd(TODAY);

  /* ---------------- 상태 ---------------- */
  var state = { cat:"all", date:null };

  /* ---------------- 헤더: 오늘 / D-Day ---------------- */
  var todayLabel = document.getElementById("todayLabel");
  todayLabel.textContent = TODAY.getFullYear() + "." + pad(TODAY.getMonth()+1) + "." + pad(TODAY.getDate()) + " (" + DOW[TODAY.getDay()] + ")";

  var ddayEl = document.getElementById("dday");
  var ddayNum = document.getElementById("ddayNum");
  var diff = daysBetween(TODAY, parse(MOVE_DAY));
  if (diff > 0) {
    ddayNum.textContent = diff;
    ddayEl.setAttribute("aria-label", "이사까지 " + diff + "일 남았습니다");
    if (diff <= 7) ddayEl.classList.add("soon");
  } else if (diff === 0) {
    ddayEl.innerHTML = "D-DAY<small>오늘 이사</small>";
    ddayEl.classList.add("today");
    ddayEl.setAttribute("aria-label", "오늘 이사입니다");
  } else {
    ddayEl.innerHTML = "D+" + (-diff) + "<small>이사 완료</small>";
    ddayEl.classList.add("today");
  }

  /* ---------------- 다음 일정 ---------------- */
  (function(){
    var upcoming = EVENTS
      .filter(function(e){ return e.date && daysBetween(TODAY, parse(e.date)) >= 0; })
      .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var box = document.getElementById("nextup");
    if (!upcoming.length) { box.innerHTML = '<span class="lbl">NEXT</span><b>남은 일정이 없어요</b>'; return; }
    var n = upcoming[0];
    var d = parse(n.date);
    var left = daysBetween(TODAY, d);
    box.innerHTML =
      '<span class="lbl">NEXT</span>' +
      '<b>' + d.getMonth()+1 + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ") · " + n.title + '</b>' +
      '<span class="tick">' + (left === 0 ? "오늘" : "D-" + left) + '</span>';
  })();

  /* ---------------- 요약 스탯 ---------------- */
  (function(){
    var done = EVENTS.filter(function(e){ return e.status === "확정"; }).length;
    document.getElementById("statAll").textContent = EVENTS.length;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statPend").textContent = EVENTS.length - done;
  })();

  /* ---------------- 필터 탭 ---------------- */
  var tabsEl = document.getElementById("tabs");
  var tabDefs = [{id:"all", label:"전체"}].concat(CATS.map(function(c){ return {id:c.id, label:c.label}; }));
  tabsEl.innerHTML = tabDefs.map(function(t){
    return '<button class="tab" type="button" data-cat="' + t.id + '" aria-pressed="' +
      (t.id === "all" ? "true" : "false") + '">' + t.label + '</button>';
  }).join("");
  tabsEl.addEventListener("click", function(ev){
    var b = ev.target.closest(".tab");
    if (!b) return;
    state.cat = b.getAttribute("data-cat");
    syncTabs(); render();
  });
  function syncTabs(){
    Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-cat") === state.cat ? "true" : "false");
    });
  }

  /* ---------------- 미니 달력 ---------------- */
  function colorOf(cat){ return (CAT_MAP[cat] || {}).color || "#B9B2A6"; }

  function eventDatesInMonth(y, m){
    var map = {};
    EVENTS.forEach(function(e){
      if (!e.date) return;
      var d = parse(e.date);
      if (d.getFullYear() === y && d.getMonth() === m) {
        (map[e.date] = map[e.date] || []).push(colorOf(e.cat));
      }
    });
    return map;
  }

  function buildMonth(y, m){
    var first = new Date(y, m, 1);
    var start = first.getDay();
    var lastDate = new Date(y, m + 1, 0).getDate();
    var map = eventDatesInMonth(y, m);
    var html = '<div class="cal"><div class="cal-head"><span class="m">' + (m+1) + '월</span>' +
               '<span class="y">' + y + '</span></div><div class="dow">' +
               DOW.map(function(d){ return '<span>' + d + '</span>'; }).join("") +
               '</div><div class="days">';
    for (var i = 0; i < start; i++) html += '<div class="pad"></div>';
    for (var day = 1; day <= lastDate; day++) {
      var ds = y + "-" + pad(m+1) + "-" + pad(day);
      var dots = map[ds];
      var cls = "day";
      if (dots) cls += " has";
      if (ds === TODAY_STR) cls += " today";
      if (ds === state.date) cls += " sel";
      var label = (m+1) + "월 " + day + "일" + (dots ? " · 일정 " + dots.length + "건" : " · 일정 없음");
      html += dots || ds === TODAY_STR
        ? '<button class="' + cls + '" type="button" data-date="' + ds + '" aria-label="' + label + '">' + day +
          (dots ? '<span class="dots">' + dots.map(function(c){ return '<i style="background:' + c + '"></i>'; }).join("") + '</span>' : '') +
          '</button>'
        : '<div class="' + cls + '" aria-label="' + label + '">' + day + '</div>';
    }
    html += '</div></div>';
    return html;
  }

  var calsEl = document.getElementById("cals");
  function renderCals(){
    calsEl.innerHTML = buildMonth(2026, 10) + buildMonth(2026, 11);
  }
  calsEl.addEventListener("click", function(ev){
    var b = ev.target.closest(".day.has");
    if (!b) return;
    var ds = b.getAttribute("data-date");
    state.date = (state.date === ds) ? null : ds;
    renderCals(); render();
    if (state.date) {
      var first = document.querySelector('.item[data-date="' + state.date + '"]');
      var target = first || document.getElementById("timeline");
      if (first) {
        var y = window.pageYOffset + target.getBoundingClientRect().top - 18;
        window.scrollTo({top:y, behavior:"smooth"});
      }
    }
  });

  /* ---------------- 타임라인 ---------------- */
  var tlEl = document.getElementById("timeline");
  var emptyEl = document.getElementById("empty");
  var clearBtn = document.getElementById("clearFilter");

  function fmtDate(s){
    var d = parse(s);
    return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")";
  }

  function matches(e){
    if (state.cat !== "all" && e.cat !== state.cat) return false;
    if (state.date && e.date !== state.date) return false;
    return true;
  }

  function cardHTML(e, idx){
    var cat = CAT_MAP[e.cat] || {label:"기타"};
    var st = STATUS[e.status] || STATUS["대기"];
    var undated = !e.date;
    var past = e.date && daysBetween(parse(e.date), TODAY) > 0 && e.status !== "확정";
    var when = undated
      ? '<span class="when undated">일정 미정</span>'
      : '<span class="when"><span class="cal-ico">◷</span>' + fmtDate(e.date) + '</span>';
    return '<article class="item' + (undated ? " undated" : "") + (e.hero ? " hero-item" : "") + (past ? " past" : "") +
      '" data-cat="' + e.cat + '"' + (e.date ? ' data-date="' + e.date + '"' : "") +
      ' style="animation-delay:' + Math.min(idx * 45, 320) + 'ms">' +
      '<div class="card">' +
        '<div class="card-top">' + when +
          '<span class="badge status ' + st.cls + '">' + e.status + '</span>' +
        '</div>' +
        '<h3>' + e.title + '</h3>' +
        '<p class="memo">' + e.memo + '</p>' +
        '<div class="card-foot"><span class="badge cat">' + cat.label + '</span></div>' +
      '</div></article>';
  }

  function render(){
    var list = EVENTS.filter(matches).slice().sort(function(a, b){
      // 날짜 있는 일정 먼저, 날짜 오름차순 / 미정은 상태 순
      if (a.date && b.date) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        return (STATUS[a.status] || {}).order - (STATUS[b.status] || {}).order;
      }
      if (a.date) return -1;
      if (b.date) return 1;
      return (STATUS[a.status] || {}).order - (STATUS[b.status] || {}).order;
    });

    tlEl.innerHTML = list.map(cardHTML).join("");
    emptyEl.hidden = list.length > 0;

    var filtered = state.cat !== "all" || state.date;
    if (filtered) {
      var label = state.date ? fmtDate(state.date) + " 일정" : (CAT_MAP[state.cat] || {}).label;
      clearBtn.hidden = false;
      clearBtn.textContent = label + " · 필터 해제 ×";
    } else {
      clearBtn.hidden = true;
    }
  }

  clearBtn.addEventListener("click", function(){
    state.cat = "all"; state.date = null;
    syncTabs(); renderCals(); render();
  });

  /* ---------------- 시작 ---------------- */
  renderCals();
  render();
})();
</script>
</body>
</html>
